name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  audit:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: Homebrew/actions/setup-homebrew@49d03f1bf5d455a413dfbdf99e6718054a4cd975 # 2026-09-11
      # setup-homebrew taps this repository itself.
      - name: Style and audit
        run: |
          shopt -s nullglob
          casks=()
          for f in Casks/*.rb; do casks+=("nateships/tap/$(basename "$f" .rb)"); done
          brew style "${casks[@]}"
          for c in "${casks[@]}"; do brew audit --cask --strict --online "$c"; done
